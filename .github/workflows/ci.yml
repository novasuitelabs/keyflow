name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build Extension
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint
      continue-on-error: true

    - name: Build extension
      run: npm run build

    - name: Verify build output
      run: |
        echo "Checking build output files..."
        ls -la public/
        test -f public/manifest.json || { echo "❌ manifest.json missing"; exit 1; }
        test -f public/popup.html || { echo "❌ popup.html missing"; exit 1; }
        test -f public/popup.js || { echo "❌ popup.js missing"; exit 1; }
        test -f public/popup.css || { echo "❌ popup.css missing"; exit 1; }
        test -f public/background.js || { echo "❌ background.js missing"; exit 1; }
        test -f public/content.js || { echo "❌ content.js missing"; exit 1; }
        echo "✅ All required files present"

    - name: Build statistics
      run: |
        echo "## 📊 Build Statistics" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Node Version:** ${{ matrix.node-version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### File Sizes" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
        echo "|------|------|" >> $GITHUB_STEP_SUMMARY
        cd public
        for file in *.js *.css *.html *.json; do
          if [ -f "$file" ]; then
            size=$(du -h "$file" | cut -f1)
            echo "| $file | $size |" >> $GITHUB_STEP_SUMMARY
          fi
        done
        echo "" >> $GITHUB_STEP_SUMMARY
        total_size=$(du -sh . | cut -f1)
        echo "**Total Size:** $total_size" >> $GITHUB_STEP_SUMMARY

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: extension-build-node-${{ matrix.node-version }}
        path: public/
        retention-days: 7

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run security audit
      run: npm audit --audit-level=moderate
      continue-on-error: true

    - name: Check for outdated dependencies
      run: npm outdated || true

    - name: Security summary
      run: |
        echo "## 🔒 Security Audit" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Running security checks..." >> $GITHUB_STEP_SUMMARY
        npm audit --json > audit.json || true
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "See workflow logs for detailed security audit results." >> $GITHUB_STEP_SUMMARY
