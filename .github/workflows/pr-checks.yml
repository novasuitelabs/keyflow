name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-info:
    name: PR Information
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build extension
      run: npm run build

    - name: Calculate bundle sizes
      id: bundle_size
      run: |
        echo "Calculating bundle sizes..."
        cd public
        
        popup_js_size=$(stat -f%z popup.js 2>/dev/null || stat -c%s popup.js)
        popup_css_size=$(stat -f%z popup.css 2>/dev/null || stat -c%s popup.css)
        background_js_size=$(stat -f%z background.js 2>/dev/null || stat -c%s background.js)
        content_js_size=$(stat -f%z content.js 2>/dev/null || stat -c%s content.js)
        
        popup_js_kb=$((popup_js_size / 1024))
        popup_css_kb=$((popup_css_size / 1024))
        background_js_kb=$((background_js_size / 1024))
        content_js_kb=$((content_js_size / 1024))
        total_kb=$(((popup_js_size + popup_css_size + background_js_size + content_js_size) / 1024))
        
        echo "popup_js_kb=$popup_js_kb" >> $GITHUB_OUTPUT
        echo "popup_css_kb=$popup_css_kb" >> $GITHUB_OUTPUT
        echo "background_js_kb=$background_js_kb" >> $GITHUB_OUTPUT
        echo "content_js_kb=$content_js_kb" >> $GITHUB_OUTPUT
        echo "total_kb=$total_kb" >> $GITHUB_OUTPUT

    - name: Comment on PR
      uses: actions/github-script@v7
      with:
        script: |
          const comment = `## 🚀 Build Successful!

          ### 📊 Bundle Sizes
          
          | File | Size |
          |------|------|
          | popup.js | ${{ steps.bundle_size.outputs.popup_js_kb }} KB |
          | popup.css | ${{ steps.bundle_size.outputs.popup_css_kb }} KB |
          | background.js | ${{ steps.bundle_size.outputs.background_js_kb }} KB |
          | content.js | ${{ steps.bundle_size.outputs.content_js_kb }} KB |
          | **Total** | **${{ steps.bundle_size.outputs.total_kb }} KB** |

          ### ✅ Build Artifacts

          The extension has been successfully built and is ready for testing!

          #### Test this PR:
          1. Download the build artifacts from the workflow run
          2. Extract the files
          3. Load the extension in Chrome:
             - Go to \`chrome://extensions/\`
             - Enable "Developer mode"
             - Click "Load unpacked"
             - Select the extracted \`public\` folder

          #### Security Notes:
          - All passwords are encrypted with AES-256-GCM
          - Master password uses PBKDF2 with 100,000 iterations
          - No data leaves your device

          ---
          *This comment was automatically generated by the PR Checks workflow.*
          `;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint
      continue-on-error: true

    - name: Check for TODO comments
      run: |
        echo "## 📝 TODO Comments" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if grep -r "TODO\|FIXME\|HACK" src/ --exclude-dir=node_modules || true; then
          echo "Found TODO/FIXME/HACK comments. Consider addressing these before merging." >> $GITHUB_STEP_SUMMARY
        else
          echo "No TODO/FIXME/HACK comments found. ✅" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Check for console.log statements
      run: |
        echo "## 🐛 Console Statements" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if grep -r "console\." src/ --exclude-dir=node_modules | grep -v "console.error\|console.warn" || true; then
          echo "⚠️ Found console.log statements. These should be removed for production." >> $GITHUB_STEP_SUMMARY
        else
          echo "No console.log statements found. ✅" >> $GITHUB_STEP_SUMMARY
        fi
